<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      min-height: 100vh;
      background: #030303;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      gap: 24px;
      font-family: Courier, monospace;
    }

    .tree-box {
      border: 1px solid #1a1a1a;
      padding: 20px;
      width: 260px;
    }

    .section-title {
      color: #777;
      font-size: 14px;
      margin: 6px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .tree-list {
      list-style: none
    }

    .tree-list li {
      border-left: 1px solid #1a1a1a
    }

    .tree-list li a {
      color: #666;
      text-decoration: none;
      font-size: 13px;
      display: block;
      padding: 3px 0 3px 12px;
    }

    .tree-list li a:hover {
      background: #0f0f0f;
      color: #888;
    }

    .tree-list li a::before {
      content: "- ";
      color: #333;
    }

    #header {
      font-family: "Jersey 10", sans-serif;
      color: #bdbdbd;
      margin-bottom: 10px;
    }

    .section pre {
      color: #bdbdbd
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .blank-box {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      width: 400px;
      height: 400px;
      overflow: hidden;
    }

    .blank-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 400px;
    }

    .track-title {
      color: #bdbdbd;
      font-size: 13px
    }

    .track-artist {
      color: #666;
      font-size: 11px
    }

    .bar {
      height: 2px;
      background: #1a1a1a;
      cursor: pointer
    }

    .fill {
      height: 100%;
      background: #bdbdbd;
      width: 0
    }

    .times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>

<body>

  <!-- LEFT -->
  <div class="tree-box">
    <div class="section">
      <pre>
 ╱|、
(˚ˎ 。7  
|、˜〵          
じしˍ,)ノ
---------
</pre>

      <h1 id="header">crucifix[.]lol</h1>

      <p class="section-title">+ files</p>
      <ul class="tree-list">
        <li><a href="#">maison</a></li>
        <li><a href="#">tayek</a></li>
        <li><a href="#">otis</a></li>
        <li><a href="#">rifle</a></li>
      </ul>
    </div>
  </div>

  <div class="right-col">

    <div class="player">
      <div id="title" class="track-title"></div>
      <div id="artist" class="track-artist"></div>

      <div id="bar" class="bar">
        <div id="fill" class="fill"></div>
      </div>

      <div class="times">
        <span id="time">0:00</span>
        <span id="dur">0:00</span>
      </div>
    </div>

    <div class="blank-box">
      <img src="https://i.pinimg.com/736x/74/9a/33/749a33f45fa63a2e256cd797d821c669.jpg">
    </div>

  </div>

  <script>
    const tracks = [
      {
        title: "Electronica",
        artist: " ",
        src: "songs/Electronica.mp3"
      },
      {
        title: "Stab The Voice",
        artist: " ",
        src: "songs/Stab The Voice.mp3"
      },
      {
        title: "Under A Siege",
        artist: " ",
        src: "songs/Under A Siege.mp3"
      }
    ];

    let i = 0;
    const audio = new Audio();

    const $ = id => document.getElementById(id);
    const fmt = s => `${s / 60 | 0}:${(s % 60 | 0).toString().padStart(2, '0')}`;

    function load(n) {
      i = (n + tracks.length) % tracks.length;
      const t = tracks[i];

      audio.src = t.src;
      $("title").textContent = t.title;
      $("artist").textContent = t.artist;

      audio.play().catch(() => { }); 
    }

    audio.addEventListener("loadedmetadata", () => {
      $("dur").textContent = fmt(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      $("time").textContent = fmt(audio.currentTime);
      $("fill").style.width = (audio.currentTime / audio.duration * 100 || 0) + "%";
    });

    audio.addEventListener("ended", () => load(i + 1));

    $("bar").onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - r.left) / r.width;
      audio.currentTime = pct * audio.duration;
    };

    load(Math.floor(Math.random() * tracks.length));
  </script>

  <script>
    let started = false;

    function unlockAudio() {
      if (started) return;
      started = true;
      audio.play().catch(() => { });
      document.removeEventListener("click", unlockAudio);
    }

    document.addEventListener("click", unlockAudio);
  </script>

</body>

</html>
