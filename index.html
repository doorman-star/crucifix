    body {
      
      min-height: 100vh;

      display: flex;
      justify-content: center;

    .tree-box {

    .section {

    .section-title {
      color: #777777;
      font-size: 14px;
      margin-bottom: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .tree-list {
      list-style: none;
    }

    .tree-list li {
      border-left: 1px solid #1a1a1a;
    }

    .tree-list li a {
      color: #666666;
      text-decoration: none;
      font-size: 13px;
      display: block;
      padding: 3px 0 3px 12px;
    }

    .tree-list li a:hover {
      background-color: #0f0f0f;
      color: #888888;
    }

    .tree-list li a::before {
      content: "- ";
      color: #333333;
    }

    .blank-box {
      background-color: #0a0a0a;
      border: 1px solid #1a1a1a;
      width: 400px;
      height: 400px;
      overflow: hidden;
    }

    .blank-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #header {
      color: white;
      font-family: Courier;
      margin-bottom: 10px;
      font-family: "Jersey 10", sans-serif;
      color: #bdbdbd;
    }

    .section pre {
      color: #bdbdbd;
    }
